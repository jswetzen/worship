name: Release song bundle

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Zip songs and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Swedish songs
        uses: actions/checkout@v4
        with:
          repository: jswetzen/worship-swedish
          path: worship-swedish

      - name: Build worshipsongs.zip
        # -j flattens worship-swedish/ so all songs sit at the zip root
        run: zip -j worshipsongs.zip *.onsong worship-swedish/*.onsong

      - name: Build set zips
        # One dist/<name>.zip per sets/<name>.txt. Songs the script cannot
        # find are skipped with a warning in this step's log rather than
        # failing the release.
        run: ./build-sets.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build set PDFs
        # One dist/<name>.pdf per sets/<name>.txt, transposed where the set
        # line asks for a key. build.py declares its own dependencies (the
        # typst package) inline, so uv needs no project to install them, and
        # it ignores system fonts in favour of tools/setpdf/fonts, so the
        # runner's PDF matches a local build. The unit tests run first: a
        # transposer regression would otherwise ship wrong chords silently.
        run: |
          uv run --with pytest --with 'typst==0.15.*' pytest -q tools/setpdf/test_build.py
          uv run tools/setpdf/build.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          files: |
            worshipsongs.zip
            dist/*.zip
            dist/*.pdf
